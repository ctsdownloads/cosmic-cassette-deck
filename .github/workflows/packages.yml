name: packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ── .deb + .rpm ─────────────────────────────────────────────────────────────
  # Build on the OLDEST target (Ubuntu 24.04, glibc 2.39). That single binary
  # runs on 24.04, 26.04, and Fedora 44 (all newer glibc). One compile, both
  # packages.
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain (rustup, current stable)
        uses: dtolnay/rust-toolchain@stable

      - name: System build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc binutils pkg-config rpm \
            libasound2-dev libwayland-dev libxkbcommon-dev

      - name: Install packagers
        run: cargo install --locked cargo-deb cargo-generate-rpm

      - name: Build (the only compile)
        run: cargo build --release --locked

      - name: Strip
        run: strip -s target/release/cosmic-cassette-deck

      - name: Package .deb (wraps the built binary)
        run: cargo deb --no-build

      - name: Package .rpm (same binary, no rebuild)
        run: cargo generate-rpm

      - name: Collect into dist/
        run: |
          mkdir -p dist
          cp target/debian/*.deb dist/
          cp target/generate-rpm/*.rpm dist/
          ls -l dist/

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: dist/*

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  # ── .flatpak bundle ─────────────────────────────────────────────────────────
  # This is the ONLY practical install route on atomic distros (Bluefin, Aurora,
  # Bazzite, Silverblue, Kinoite), where layering an .rpm is an anti-pattern and
  # is disabled outright on some variants. Also covers Arch, Debian, openSUSE,
  # Mint, and anything else with no native package here.
  #
  # Runs in parallel with the job above and is much slower: it downloads the
  # freedesktop runtime and the llvm/rust SDK extensions, then compiles
  # libcosmic inside the sandbox. Expect 30-45 minutes.
  flatpak:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # bubblewrap (which flatpak-builder shells out to) needs unprivileged user
      # namespaces. Ubuntu 24.04 blocks them via AppArmor by default, and the
      # build dies with a bwrap permission error without this.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install flatpak and flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user \
            flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      # Flathub hosts the RUNTIME (org.freedesktop.Platform + the rust/llvm SDK
      # extensions). That is just where those artifacts live; the app itself is
      # not submitted to or published on Flathub.
      - name: Build the flatpak
        run: |
          flatpak-builder --user --install-deps-from=flathub \
            --repo=repo --force-clean --disable-rofiles-fuse \
            build-dir io.github.ctsdownloads.CosmicCassetteDeck.yml

      # --runtime-repo embeds where the runtime can be fetched from, so a user
      # installing this bundle on a machine without the runtime gets prompted to
      # pull it automatically instead of hitting a hard error.
      - name: Make the single-file bundle
        run: |
          mkdir -p dist
          flatpak build-bundle \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            repo dist/cosmic-cassette-deck.flatpak \
            io.github.ctsdownloads.CosmicCassetteDeck
          ls -lh dist/

      - uses: actions/upload-artifact@v7
        with:
          name: flatpak
          path: dist/*.flatpak

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.flatpak
