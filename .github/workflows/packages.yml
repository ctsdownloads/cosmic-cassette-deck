name: packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    # Build on the OLDEST target (Ubuntu 24.04, glibc 2.39). That single binary
    # runs on 24.04, 26.04, and Fedora 44 (all newer glibc). One compile, both
    # packages. No matrix, no Fedora container.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # rustup -> current stable, matching the README. One toolchain, one build.
      - name: Rust toolchain (rustup, current stable)
        uses: dtolnay/rust-toolchain@stable

      - name: System build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc binutils pkg-config rpm \
            libasound2-dev libwayland-dev libxkbcommon-dev

      - name: Install packagers
        run: cargo install --locked cargo-deb cargo-generate-rpm

      - name: Build (the only compile)
        run: cargo build --release --locked

      - name: Strip
        run: strip -s target/release/cosmic-cassette-deck

      - name: Package .deb (wraps the built binary)
        run: cargo deb --no-build

      - name: Package .rpm (same binary, no rebuild)
        run: cargo generate-rpm

      - name: Collect into dist/
        run: |
          mkdir -p dist
          cp target/debian/*.deb dist/
          cp target/generate-rpm/*.rpm dist/
          ls -l dist/

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: dist/*

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
