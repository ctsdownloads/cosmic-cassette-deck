[package]
name = "cosmic-cassette-deck"
version = "0.0.15"
edition = "2021"
description = "Photoreal 80s cassette player for local music, built on libcosmic"
license = "GPL-3.0-only"
repository = "https://github.com/ctsdownloads/cosmic-cassette-deck"
readme = "README.md"
keywords = ["cosmic", "cassette", "music-player", "audio", "libcosmic"]
categories = ["multimedia::audio", "gui"]


[[bin]]
name = "cosmic-cassette-deck"
path = "src/main.rs"

[dependencies]
# libcosmic vendors its own iced fork with canvas + image support already
# enabled internally, so there are NO user-facing "canvas"/"image" features to
# request (asking for them is a build error). Defaults cover winit, wayland,
# tokio, a11y; we add the wgpu renderer. Pin a git rev once it builds.
libcosmic = { git = "https://github.com/pop-os/libcosmic", rev = "ee5d965983957271cf759fd76e3e4eed4f188d35", features = ["wgpu"] }

# Audio playback. 0.20 API: OutputStream::try_default + Sink::try_new +
# get_pos/try_seek. (0.21 moved to OutputStreamBuilder; migrate deliberately.)
rodio = { version = "0.20", default-features = false, features = [
    "symphonia-mp3",
    "symphonia-flac",
    "symphonia-vorbis",
    "symphonia-isomp4",
    "symphonia-aac",
    "symphonia-wav",
] }

# Metadata + embedded album art
lofty = "0.22"

# Label text rasterization (glyph outlines to RGBA buffer)
ab_glyph = "0.2"

# MPRIS D-Bus service: media keys, playerctl, panel controls
mpris-server = "0.8"

# Native file picker via XDG portal
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }

walkdir = "2"
tokio = { version = "1", features = ["rt", "time"] }

# Album-art scraping: blocking HTTP (run inside spawn_blocking), JSON parse.
ureq = { version = "2", features = ["json", "tls"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
serde_json = "1"

[profile.release]
lto = "thin"

# ─────────────────────────────────────────────────────────────────────────────
# Distro packaging metadata — append ONCE to the end of Cargo.toml.
# Feeds cargo-deb (.deb) and cargo-generate-rpm (.rpm) in CI.
# name / version / license are read from [package] above; only packaging-
# specific bits (assets + runtime deps) live here.
#
# Verified against THIS repo:
#   binary  -> cosmic-cassette-deck            ([[bin]] name)
#   desktop -> res/io.github.ctsdownloads.CosmicCassetteDeck.desktop
#   icon    -> res/io.github.ctsdownloads.CosmicCassetteDeck.svg
#   LICENSE -> repo root (cargo-deb auto-detects it -> copyright file)
# Runtime deps reflect real linkage: rodio->ALSA, wayland-client, libxkbcommon
# (winit keymap), and wgpu which DLOPENS the Vulkan loader at runtime.
# ─────────────────────────────────────────────────────────────────────────────

[package.metadata.deb]
maintainer = "ctsdownloads <ctsdownloads@users.noreply.github.com>"
copyright = "2026 ctsdownloads, GPL-3.0-only"
section = "sound"
priority = "optional"
extended-description = "Photorealistic 80s cassette player for local music, built as a native COSMIC/libcosmic application."
assets = [
    ["target/release/cosmic-cassette-deck", "usr/bin/", "755"],
    ["res/io.github.ctsdownloads.CosmicCassetteDeck.desktop", "usr/share/applications/", "644"],
    ["res/io.github.ctsdownloads.CosmicCassetteDeck.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
]
# $auto = dpkg-shlibdeps for LINKED libs (libasound2, libc6, libgcc-s1, ...).
# wgpu dlopens libvulkan and winit dlopens libxkbcommon/wayland, so shlibdeps
# can't see those -> list them by hand.
depends = "$auto, libwayland-client0, libxkbcommon0, libvulkan1, adwaita-icon-theme"
# A real Vulkan ICD so it renders on a clean install (mesa also ships the
# lavapipe software fallback). Kept as Recommends: apt installs it by default,
# and an NVIDIA-proprietary user with their own ICD can drop it.
recommends = "mesa-vulkan-drivers"

[package.metadata.generate-rpm]
summary = "Photorealistic 80s cassette player for local music"
assets = [
    { source = "target/release/cosmic-cassette-deck", dest = "/usr/bin/cosmic-cassette-deck", mode = "755" },
    { source = "res/io.github.ctsdownloads.CosmicCassetteDeck.desktop", dest = "/usr/share/applications/io.github.ctsdownloads.CosmicCassetteDeck.desktop", mode = "644" },
    { source = "res/io.github.ctsdownloads.CosmicCassetteDeck.svg", dest = "/usr/share/icons/hicolor/scalable/apps/io.github.ctsdownloads.CosmicCassetteDeck.svg", mode = "644" },
]

# Fedora package names. vulkan-loader provides libvulkan.so.1. mesa-vulkan-drivers
# is a hard Requires on Fedora (near-universal, includes lavapipe fallback) to
# guarantee a working ICD without depending on weak-dep support in the tool.
[package.metadata.generate-rpm.requires]
alsa-lib = "*"
libwayland-client = "*"
libxkbcommon = "*"
vulkan-loader = "*"
mesa-vulkan-drivers = "*"
adwaita-icon-theme = "*"
